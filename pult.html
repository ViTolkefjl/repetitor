<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пульт учителя</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="teacher">

<!-- вход -->
<section class="login hide" id="login">
  <h1>Пульт учителя</h1>
  <p class="muted">Войди своим Google-аккаунтом. Включи VPN, если страница не отвечает.</p>
  <button class="btn" id="signin">Войти через Google</button>
  <div class="err" id="loginErr"></div>
</section>

<!-- пульт -->
<div class="pult hide" id="pult">
  <header class="p-top">
    <div class="status" id="status"><i class="lamp"></i><div><span id="stText">—</span><small id="stSub"></small></div></div>
    <div class="meter">В блоке <b id="mTotal">—</b></div>
    <div class="meter">Активно <b id="mActive">—</b></div>
    <div class="meter">Готово <b id="mDone">—</b></div>
    <div class="spacer"></div>
    <button class="btn light small" id="linkBtn">Ссылка для брата</button>
    <button class="btn plain small" id="backupBtn">Резервная копия</button>
    <button class="btn plain small" id="signout">Выйти</button>
  </header>

  <div class="panel hide" id="linkPanel">
    <h3>Ссылка для брата</h3>
    <p class="muted" style="margin:0">Отправь её брату и сохрани у него в закладках. Входить никуда не нужно.</p>
    <div class="linkbox" id="linkText"></div>
    <button class="btn small" id="copyLink">Скопировать</button>
  </div>

  <div class="p-bar">
    <h2 class="p-h">Блоки</h2>
    <button class="btn small" id="newBtn">Новый блок</button>
  </div>
  <div class="lesson-list" id="lessonList"></div>

  <div class="panel hide" id="newPanel">
    <h3>Новый блок</h3>
    <div id="ready"></div>
    <label for="importText">Или вставь блок заданий, который подготовил Claude</label>
    <textarea id="importText" placeholder='{ "title": "Математика на 29 октября", "tasks": [ … ] }'></textarea>
    <div class="p-bar" style="margin:12px 0 0">
      <button class="btn" id="importBtn">Создать блок</button>
      <span class="muted">или</span>
      <input id="emptyTitle" placeholder="Название пустого блока" style="flex:1 1 200px;width:auto">
      <button class="btn light" id="emptyBtn">Создать пустой</button>
    </div>
    <div class="err" id="importErr"></div>
  </div>

  <div id="lessonView"></div>
</div>

<div class="toast hide" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { db, now, TS, esc, check, dur, clock, randomKey, sortedTasks, lettersFromKey, isTask, enc, status, finished } = REP;
  const GAP = /_{2,}/g;
  const realTasks = l => sortedTasks(l).filter(isTask);
  const $ = id => document.getElementById(id);
  const auth = firebase.auth();

  let room = null, R = null;
  let lessons = {}, open = {}, done = {}, current = null, viewId = null;
  let answers = {}, marks = {}, keys = {}, presence = {}, curAnswers = {}, curMarks = {};
  let viewUnsubs = [], curUnsubs = [], curFor = null;
  let connected = true, connTimer = null;
  let showKeys = false;
  try { showKeys = localStorage.getItem('rep_keys') === '1'; } catch (e) {}

  // подписка, которую можно снять точечно
  function listen(ref, cb) {
    const h = ref.on('value', cb, fail);
    return () => ref.off('value', h);
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hide');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hide'), 2400);
  }
  function fail(e) {
    console.error(e);
    const m = String(e && (e.code || e.message) || e);
    toast(/permission/i.test(m) ? 'Нет доступа к базе — обнови правила Firebase' : 'Ошибка: ' + m);
  }

  /* ---------- вход ---------- */
  const AUTH_ERR = {
    'auth/unauthorized-domain': 'Firebase не знает этот сайт. Добавь vitolkefjl.github.io: Authentication → Settings → Authorized domains.',
    'auth/operation-not-allowed': 'Вход через Google выключен. Включи: Authentication → Sign-in method → Google.',
    'auth/configuration-not-found': 'Вход через Google ещё не настроен. Открой Authentication → Get started → Google.',
    'auth/popup-blocked': 'Браузер заблокировал окно входа. Разреши всплывающие окна для этого сайта.',
    'auth/network-request-failed': 'Нет связи с Google. Включи VPN и попробуй ещё раз.'
  };
  $('signin').onclick = () => {
    $('loginErr').textContent = '';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      $('loginErr').textContent = AUTH_ERR[e.code] || ('Не получилось войти: ' + (e.code || e.message));
    });
  };
  $('signout').onclick = () => auth.signOut().then(() => location.reload());

  auth.onAuthStateChanged(user => {
    if (!user) { $('pult').classList.add('hide'); $('login').classList.remove('hide'); return; }
    start(user).catch(e => {
      $('login').classList.remove('hide'); $('pult').classList.add('hide');
      $('signin').classList.add('hide');
      $('loginErr').innerHTML = esc(e.message || e) + '<br><button class="btn light small" style="margin-top:10px" onclick="firebase.auth().signOut().then(()=>location.reload())">Выйти</button>';
    });
  });

  async function start(user) {
    const ownerRef = db.ref('owner');
    let owner = (await ownerRef.once('value')).val();
    if (!owner) { await ownerRef.set(user.uid); owner = user.uid; }
    if (owner !== user.uid) throw new Error('Этот пульт уже привязан к другому Google-аккаунту (' + (user.email || '') + ' — не тот).');

    room = (await db.ref('teacher/room').once('value')).val();
    if (!room) {
      room = randomKey(24);
      await db.ref().update({ ['rooms/' + room + '/meta']: { created: TS }, 'teacher/room': room });
    }
    R = db.ref('rooms/' + room);
    $('login').classList.add('hide'); $('pult').classList.remove('hide');
    await migrate();

    const link = location.href.replace(/[^/]*([?#].*)?$/, '') + 's.html#k=' + room;
    $('linkText').textContent = link;
    $('copyLink').onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
        .then(() => toast('Ссылка скопирована')).catch(() => prompt('Скопируй ссылку:', link));
    };

    R.child('lessons').on('value', s => {
      lessons = s.val() || {};
      if (!viewId || !lessons[viewId]) setView(defaultView()); else { renderList(); renderLesson(); }
    }, fail);
    R.child('open').on('value', s => { open = s.val() || {}; renderList(); renderHead(); });
    R.child('done').on('value', s => { done = s.val() || {}; renderList(); renderHead(); });
    R.child('presence').on('value', s => {
      presence = s.val() || {};
      followStudent();
      paintTop(); paintRows(); renderList();
    });
    db.ref('.info/connected').on('value', s => {
      clearTimeout(connTimer);
      if (s.val()) { connected = true; paintTop(); }
      else connTimer = setTimeout(() => { connected = false; paintTop(); }, 3000);
    });
    setInterval(() => { paintTop(); paintRows(); }, 1000);
    fetchIndex().catch(() => {});
  }

  // переход со старого формата (одно «текущее» занятие) и ключи для самопроверки у старых занятий
  async function migrate() {
    const [cur, ls, ks, ch] = await Promise.all(['current', 'lessons', null, 'check'].map(p =>
      (p ? R.child(p) : db.ref('keys/' + room)).once('value').then(s => s.val())));
    const upd = {};
    if (cur) { upd['rooms/' + room + '/open/' + cur] = true; upd['rooms/' + room + '/current'] = null; }
    Object.keys(ks || {}).forEach(lid => {
      if (!(ls || {})[lid]) return;
      Object.keys(ks[lid] || {}).forEach(tid => {
        if (!(ch && ch[lid] && ch[lid][tid])) upd['rooms/' + room + '/check/' + lid + '/' + tid] = enc(ks[lid][tid]);
      });
    });
    if (Object.keys(upd).length) await db.ref().update(upd).catch(fail);
  }

  /* ---------- где сейчас ученик ---------- */
  const lessonList = () => Object.entries(lessons).sort((a, b) => (b[1].created || 0) - (a[1].created || 0));
  const isOpen = id => !!open[id];
  function defaultView() {
    if (presence.lesson && lessons[presence.lesson]) return presence.lesson;
    const o = lessonList().find(([id]) => isOpen(id) && !done[id]);
    return o ? o[0] : (lessonList()[0] || [null])[0];
  }
  // статус и время считаем по блоку, в котором брат сейчас
  function followStudent() {
    const want = presence.lesson && lessons[presence.lesson] ? presence.lesson : null;
    if (want === curFor) return;
    curUnsubs.forEach(f => f()); curUnsubs = []; curAnswers = {}; curMarks = {}; curFor = want;
    if (want) curUnsubs = [
      listen(R.child('answers/' + want), a => { curAnswers = a.val() || {}; paintTop(); renderList(); }),
      listen(R.child('marks/' + want), m => { curMarks = m.val() || {}; paintTop(); })
    ];
  }

  /* ---------- список блоков ---------- */
  function lessonState(id) {
    if (done[id]) return { cls: 'done', txt: 'завершён ' + clock(done[id]) };
    if (presence.online && presence.lesson === id) return { cls: 'now', txt: 'брат сейчас здесь' };
    if (!isOpen(id)) return { cls: 'off', txt: 'скрыт' };
    return { cls: 'on', txt: 'у брата' };
  }
  function renderList() {
    const box = $('lessonList');
    const list = lessonList();
    if (!list.length) { box.innerHTML = '<p class="muted">Блоков пока нет — нажми «Новый блок».</p>'; return; }
    const html = list.map(([id, l]) => {
      const st = lessonState(id);
      const d = l.created ? new Date(l.created) : null;
      const date = d ? String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') : '';
      return '<button class="lesson-chip ' + st.cls + (id === viewId ? ' sel' : '') + '" data-view="' + id + '">'
        + '<span class="lc-title">' + esc(l.title || 'Блок') + '</span>'
        + '<span class="lc-sub">' + date + ' — ' + st.txt + '</span></button>';
    }).join('');
    if (box.innerHTML !== html) {
      box.innerHTML = html;
      box.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
    }
  }

  function setView(id) {
    viewUnsubs.forEach(f => f()); viewUnsubs = [];
    viewId = id || null; answers = {}; marks = {}; keys = {};
    renderList(); renderLesson();
    if (!viewId) return;
    viewUnsubs = [
      listen(R.child('answers/' + viewId), s => { answers = s.val() || {}; paintRows(); }),
      listen(R.child('marks/' + viewId), s => { marks = s.val() || {}; paintRows(); paintTop(); }),
      listen(db.ref('keys/' + room + '/' + viewId), s => { keys = s.val() || {}; paintRows(); })
    ];
  }

  /* ---------- новый блок ---------- */
  $('newBtn').onclick = () => {
    const p = $('newPanel');
    p.classList.toggle('hide');
    if (!p.classList.contains('hide')) loadReady();
  };
  $('linkBtn').onclick = () => $('linkPanel').classList.toggle('hide');

  // готовые уроки, которые Claude кладёт в папку lessons/ репозитория
  let readyIndex = [];
  async function fetchIndex() {
    const r = await fetch('lessons/index.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    readyIndex = await r.json();
    renderHead();
    return readyIndex;
  }
  async function loadReady() {
    const box = $('ready');
    box.innerHTML = '<p class="muted">Ищу готовые уроки…</p>';
    try {
      const list = (await fetchIndex()).slice().reverse();
      if (!list.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<label>Готовые уроки от Claude</label><div class="ready-list">' + list.map((x, i) =>
        '<div class="ready-item"><span>' + esc(x.title) + (x.added ? ' <span class="muted">(' + esc(x.added) + ')</span>' : '') + '</span>'
        + '<button class="btn small" data-ready="' + i + '">Создать блок</button></div>').join('') + '</div>';
      box.querySelectorAll('[data-ready]').forEach(b => b.onclick = async () => {
        $('importErr').textContent = '';
        b.disabled = true;
        try {
          const x = list[+b.dataset.ready];
          const res = await fetch('lessons/' + x.file + '?v=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('файл урока не найден (' + res.status + ')');
          const d = await res.json();
          d.tasks.forEach((t, i) => makeTask(t, i + 1));
          await createLesson(d.title || x.title, d.tasks, d.subject, x);
        } catch (e) { $('importErr').textContent = 'Не получилось: ' + (e.message || e); }
        b.disabled = false;
      });
    } catch (e) { box.innerHTML = ''; }
  }

  function parseImport(raw) {
    const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('Не вижу блока в фигурных скобках { … }. Скопируй ответ Claude целиком.');
    let data;
    try { data = JSON.parse(raw.slice(a, b + 1)); }
    catch (e) { throw new Error('Блок повреждён (' + e.message + '). Попроси Claude прислать его заново.'); }
    if (!Array.isArray(data.tasks) || !data.tasks.length) throw new Error('В блоке нет заданий (tasks).');
    return data;
  }

  // Превращает задание из импорта в {task, key}
  const TYPES = ['short', 'steps', 'letters', 'choice', 'fill', 'match', 'sort', 'order', 'theory'];
  const S = v => v == null ? '' : String(v).trim();
  // убрать пустые поля (Firebase не принимает undefined, а пустые строки — мусор)
  function clean(o) {
    Object.keys(o).forEach(k => { if (o[k] === '' || o[k] == null) delete o[k]; });
    return o;
  }
  function shuffled(arr) {
    const a = arr.slice();
    for (let tries = 0; tries < 8; tries++) {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      if (a.length < 2 || a.join('\u0001') !== arr.join('\u0001')) break;
    }
    return a;
  }
  const count = (s, re) => (String(s).match(re) || []).length;
  function cleanCopy(c) {
    if (!c || !Array.isArray(c.lines) || !c.lines.length) return null;
    return clean({
      paper: c.paper === 'line' ? 'line' : 'cell',
      lines: c.lines.map(l => typeof l === 'string' ? l : clean({ t: S(l.t), align: l.align === 'center' ? 'center' : '', indent: l.indent != null ? +l.indent : null })),
      tips: Array.isArray(c.tips) && c.tips.length ? c.tips.map(S) : null
    });
  }

  // при обновлении урока сохраняем прежний порядок слов, если набор слов тот же (иначе ответы брата «поедут»)
  const sameSet = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.slice().sort().join('\u0001') === b.slice().sort().join('\u0001');
  const keep = (prevArr, arr) => sameSet(prevArr, arr) ? prevArr.slice() : shuffled(arr);

  function makeTask(src, n, prev) {
    const type = TYPES.includes(src.type) ? src.type : 'short';
    if (prev && prev.type !== type) prev = null;
    const name = S(src.title) || ('№ ' + n);
    const bad = msg => { throw new Error('Задание «' + name + '»: ' + msg); };
    const task = { n, type, subject: S(src.subject), title: S(src.title), text: S(src.text), hint: S(src.hint), why: S(src.why), alt: S(src.alt) };
    let key = src.answer != null ? S(src.answer) : '';
    const list = (v, what) => { if (!Array.isArray(v) || !v.length) bad('нет списка ' + what + '.'); return v; };

    if (type === 'short' && Array.isArray(src.items) && src.items.length) {
      task.items = src.items.map(it => clean({ q: S(it.q), why: S(it.why) }));
      key = src.items.map(it => S(it.a));
    }
    if (type === 'letters') {
      task.note = S(src.text);
      task.text = src.template || src.text || '';
      if (!/_/.test(task.text)) bad('нет пропусков «_».');
    }
    if (type === 'choice') {
      const items = list(src.items, 'вопросов (items)');
      task.items = items.map((it, i) => {
        const opts = (it.options || []).map(S).filter(Boolean);
        if (opts.length < 2) bad('в вопросе ' + (i + 1) + ' меньше двух вариантов.');
        if (S(it.a) && !opts.includes(S(it.a))) bad('ответ «' + S(it.a) + '» не из вариантов.');
        return clean({ q: S(it.q), tr: S(it.tr), pic: S(it.pic), options: opts, why: S(it.why) });
      });
      key = items.map(it => S(it.a));
    }
    if (type === 'fill') {
      const items = list(src.items, 'предложений (items)');
      key = [];
      task.items = items.map((it, i) => {
        const gaps = count(it.q, GAP);
        if (!gaps) bad('в предложении ' + (i + 1) + ' нет пропуска «___».');
        const a = Array.isArray(it.a) ? it.a.map(S) : [S(it.a)];
        if (a.length !== gaps) bad('в предложении ' + (i + 1) + ' пропусков ' + gaps + ', а ответов ' + a.length + '.');
        key.push(...a);
        return clean({ q: S(it.q), tr: S(it.tr), pic: S(it.pic), why: S(it.why) });
      });
      const bank = (Array.isArray(src.bank) && src.bank.length ? src.bank : key).map(S).filter(Boolean);
      const left = bank.slice();
      key.forEach(w => { const i = left.indexOf(w); if (w && i < 0) bad('слова «' + w + '» нет среди слов для перетаскивания.'); if (i >= 0) left.splice(i, 1); });
      task.bank = keep(prev && prev.bank, bank);
    }
    if (type === 'match') {
      const pairs = list(src.pairs, 'пар (pairs)');
      if (pairs.length < 2) bad('нужно хотя бы две пары.');
      task.left = pairs.map(p => S(p.l));
      task.right = keep(prev && prev.right, pairs.map(p => S(p.r)));
      key = pairs.map(p => S(p.r));
    }
    if (type === 'sort') {
      const groups = list(src.groups, 'групп (groups)').map(S);
      const srcWords = list(src.words, 'слов (words)');
      let words;
      if (prev && sameSet(prev.words, srcWords.map(w => S(w.w)))) {
        const pool = srcWords.slice();
        words = prev.words.map(w => pool.splice(pool.findIndex(x => S(x.w) === w), 1)[0]);
      } else words = shuffled(srcWords);
      words.forEach(w => { if (!groups.includes(S(w.g))) bad('у слова «' + S(w.w) + '» группа «' + S(w.g) + '» не из списка.'); });
      task.groups = groups;
      task.words = words.map(w => S(w.w));
      key = words.map(w => S(w.g));
    }
    if (type === 'order') {
      const items = list(src.items, 'предложений (items)');
      task.items = items.map((it, i) => {
        const m = S(it.a).match(/^(.*?)\s*([.!?]*)$/);
        const words = m[1].split(/\s+/).filter(Boolean);
        if (words.length < 2) bad('в предложении ' + (i + 1) + ' меньше двух слов.');
        const pw = prev && prev.items && prev.items[i] && prev.items[i].words;
        return clean({ words: keep(pw, words), end: m[2], tr: S(it.tr), pic: S(it.pic), why: S(it.why) });
      });
      key = items.map(it => S(it.a));
    }
    if (type === 'theory') {
      const cardOf = r => clean({ pic: S(r.pic), en: S(r.en), ru: S(r.ru), ex: S(r.ex) });
      task.table = (src.table || []).map(cardOf);
      if (!task.table.length) delete task.table;
      if (Array.isArray(src.groups) && src.groups.length) {
        task.groups = src.groups.map(g => clean({ name: S(g.name), sub: S(g.sub), icon: S(g.icon), color: /^#[0-9a-f]{3,8}$/i.test(S(g.color)) ? S(g.color) : '',
          desc: S(g.desc), formula: S(g.formula), cards: (g.cards || []).map(cardOf) }));
      }
      if (src.flip) task.flip = true;
      if (Array.isArray(src.tricks) && src.tricks.length) task.tricks = src.tricks.map(x => clean({ icon: S(x.icon), text: S(x.text) }));
      if (Array.isArray(src.how) && src.how.length) task.how = src.how.map(S);
      task.note = S(src.note);
      key = '';
    }
    task.copy = cleanCopy(src.copy);
    clean(task);
    return { task, key };
  }
  const hasKey = k => k !== '' && k != null && !(Array.isArray(k) && k.every(x => x === ''));

  async function createLesson(title, srcTasks, subject, from) {
    const id = R.child('lessons').push().key;
    const tasks = {}, k = {}, ch = {};
    srcTasks.forEach((s, i) => {
      const { task, key } = makeTask(s, i + 1);
      const tid = 't' + (i + 1);
      tasks[tid] = task;
      if (hasKey(key)) { k[tid] = key; ch[tid] = enc(key); }
    });
    await db.ref().update({
      ['rooms/' + room + '/lessons/' + id]: clean({ title: title || 'Домашка', subject: S(subject), created: TS, tasks,
        src: from ? from.file : '', ver: from ? (from.version || 1) : null }),
      ['keys/' + room + '/' + id]: Object.keys(k).length ? k : null,
      ['rooms/' + room + '/check/' + id]: Object.keys(ch).length ? ch : null,
      ['rooms/' + room + '/open/' + id]: true
    });
    setView(id);
    $('newPanel').classList.add('hide');
    toast('Блок создан — у брата он уже появился');
  }

  $('importBtn').onclick = () => {

  /* ---------- экран блока ---------- */
  const TYPE_NAME = { choice: 'выбор', fill: 'слово в пропуск', match: 'пары', sort: 'по группам', order: 'собери предложение', steps: 'ход решения', letters: 'вставь букву' };

  function renderHead() {
    const h = $('lessonHead');
    const l = viewId && lessons[viewId];
    if (!h || !l) return;

    const html = '<h2>' + esc(l.title || 'Блок') + '</h2>'

      + (newer(l) ? '<button class="btn small" id="updBtn">⬆ Обновить урок до новой версии</button>' : '')
      + '<button class="btn light small" id="keysBtn">' + (showKeys ? 'Скрыть ключи' : 'Показать ключи') + '</button>'
      + '<button class="btn plain small" id="delLesson">Удалить</button>';
    if (h.innerHTML === html) return;

      ub.disabled = true;
      updateLesson(viewId, newer(l)).then(() => toast('Урок обновлён — у брата он уже новый')).catch(e => { ub.disabled = false; fail(e); });

    const rb = h.querySelector('[data-reopen]');
    if (rb) rb.onclick = () => R.child('done/' + viewId).remove().catch(fail);
    $('keysBtn').onclick = () => {

    $('delLesson').onclick = () => {

      const id = viewId;
      db.ref().update({
        ['rooms/' + room + '/lessons/' + id]: null, ['rooms/' + room + '/answers/' + id]: null,
        ['rooms/' + room + '/marks/' + id]: null, ['rooms/' + room + '/check/' + id]: null,
        ['rooms/' + room + '/open/' + id]: null, ['rooms/' + room + '/done/' + id]: null,
        ['keys/' + room + '/' + id]: null
      }).then(() => setView(null)).catch(fail);

  // есть ли в папке lessons/ более новая версия этого урока
  function newer(l) {
    const e = readyIndex.find(x => (l.src && x.file === l.src) || (!l.src && (x.title === l.title || (x.aliases || []).includes(l.title))));
    return e && (e.version || 1) > (l.ver || 1) ? e : null;
  }
  async function updateLesson(id, entry) {
    const res = await fetch('lessons/' + entry.file + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('файл урока не найден (' + res.status + ')');
    const d = await res.json();
    const old = (lessons[id] && lessons[id].tasks) || {};
    const tasks = {}, k = {}, ch = {}, upd = {};
    d.tasks.forEach((src, i) => {
      const tid = 't' + (i + 1);
      const { task, key } = makeTask(src, i + 1, old[tid]);
      tasks[tid] = task;
      if (hasKey(key)) { k[tid] = key; ch[tid] = enc(key); }
      // тип задания поменялся — старый ответ к нему не подходит
      if (old[tid] && old[tid].type !== task.type) {
        upd['rooms/' + room + '/answers/' + id + '/' + tid] = null;
        upd['rooms/' + room + '/marks/' + id + '/' + tid] = null;
      }
    });
    // задания, добавленные вручную, оставляем в конце
    Object.keys(old).filter(tid => !/^t\d+$/.test(tid)).forEach((tid, j) => { tasks[tid] = Object.assign({}, old[tid], { n: d.tasks.length + 1 + j }); });
    Object.keys(old).filter(tid => /^t\d+$/.test(tid) && !tasks[tid]).forEach(tid => {
      upd['rooms/' + room + '/answers/' + id + '/' + tid] = null;
      upd['rooms/' + room + '/marks/' + id + '/' + tid] = null;
    });
    const oldKeys = (await db.ref('keys/' + room + '/' + id).once('value')).val() || {};
    Object.keys(oldKeys).filter(tid => !/^t\d+$/.test(tid)).forEach(tid => { k[tid] = oldKeys[tid]; ch[tid] = enc(oldKeys[tid]); });
    Object.assign(upd, {
      ['rooms/' + room + '/lessons/' + id + '/tasks']: tasks,
      ['rooms/' + room + '/lessons/' + id + '/title']: d.title || entry.title,
      ['rooms/' + room + '/lessons/' + id + '/src']: entry.file,
      ['rooms/' + room + '/lessons/' + id + '/ver']: entry.version || 1,
      ['keys/' + room + '/' + id]: Object.keys(k).length ? k : null,
      ['rooms/' + room + '/check/' + id]: Object.keys(ch).length ? ch : null
    });
    if (d.subject) upd['rooms/' + room + '/lessons/' + id + '/subject'] = d.subject;
    await db.ref().update(upd);
  }

        + '<h3 class="task-title">' + esc(t.title || 'Задание ' + num) + '</h3>'
        + (t.text ? '<p class="task-text">' + esc(t.type === 'letters' ? (t.note || '') : t.text) + '</p>' : '') + '</div>'
        + '<div class="row-tools">' + (TYPE_NAME[t.type] ? '<span class="tag">' + TYPE_NAME[t.type] + '</span>' : '')

    v.querySelectorAll('[data-mark]').forEach(b => b.onclick = () => {

      if (b.dataset.mark === 'fix' && !text) {
        c.focus(); c.classList.add('need');
        toast('Напиши брату, что именно доработать');
        return;
      }
      c.classList.remove('need');
      R.child('marks/' + viewId + '/' + id).set({ s: b.dataset.mark, c: text, t: TS }).catch(fail);
      c.value = '';
    });
    v.querySelectorAll('[data-unmark]').forEach(b => b.onclick = () => R.child('marks/' + viewId + '/' + b.dataset.unmark).remove().catch(fail));
    v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      if (!confirm('Убрать это задание?')) return;
      const id = b.dataset.del;
      db.ref().update({
        ['rooms/' + room + '/lessons/' + viewId + '/tasks/' + id]: null,
        ['rooms/' + room + '/answers/' + viewId + '/' + id]: null,
        ['rooms/' + room + '/marks/' + viewId + '/' + id]: null,
        ['rooms/' + room + '/check/' + viewId + '/' + id]: null,
        ['keys/' + room + '/' + viewId + '/' + id]: null
      }).catch(fail);
    });
    bindAddForm();
    paintRows();
  }

  /* ---------- сравнение «ответ брата ↔ ключ» построчно ---------- */
  const firstAlt = k => String(k == null ? '' : k).split('|')[0];
  function rowsOf(t, a, k, res) {
    const P = (a && a.parts) || [], RP = res.parts || [];
    const K = Array.isArray(k) ? k : null;
    const ans = (v, s) => v ? { v, s } : { v: '', s: 'empty' };
    if (t.type === 'choice') return (t.items || []).map((it, i) => ({ q: it.q, ...ans(P[i], RP[i]), k: K && K[i] }));
    if (t.type === 'fill') {
      const out = []; let g = 0;
      (t.items || []).forEach(it => {
        const c = count(it.q, GAP);
        for (let j = 0; j < c; j++, g++) out.push({ q: c > 1 ? it.q + ' (' + (j + 1) + ')' : it.q, ...ans(P[g], RP[g]), k: K && K[g] });
      });
      return out;
    }
    if (t.type === 'match') return (t.left || []).map((l, i) => ({ q: l, ...ans(P[i], RP[i]), k: K && K[i] }));
    if (t.type === 'sort') return (t.words || []).map((w, i) => ({ q: w, ...ans(P[i], RP[i]), k: K && K[i] }));
    if (t.type === 'order') return (t.items || []).map((it, i) => ({ q: it.tr || ('Предложение ' + (i + 1)), ...ans(P[i] ? P[i] + (it.end || '') : '', RP[i]), k: K && K[i] }));
    if (t.type === 'short' && Array.isArray(t.items)) return t.items.map((it, i) => ({ q: it.q, ...ans(P[i], RP[i]), k: K && K[i] }));
    if (t.type === 'letters') {
      const L = typeof k === 'string' ? lettersFromKey(t.text || '', k) : null;
      let n = 0;
      const out = [];
      String(t.text || '').split(/,\s*|\n/).forEach(word => {
        const c = count(word, /_/g);
        if (!c) return;
        let m = 0;
        const got = word.replace(/_/g, () => P[n + (m++)] || '_');
        const st = Array.from({ length: c }, (_, j) => RP[n + j]);
        const s = st.every(x => x === 'match') ? 'match' : st.some(x => x === 'miss') ? 'miss' : 'empty';
        let m2 = 0;
        const key = L ? word.replace(/_/g, () => L[n + (m2++)]) : null;
        const any = st.length && Array.from({ length: c }, (_, j) => P[n + j]).some(Boolean);
        out.push({ q: word, v: any ? got : '', s: got.includes('_') ? (s === 'miss' ? 'miss' : 'empty') : s, k: key });
        n += c;
      });
      if (!out.length) out.push({ q: '', v: a && a.text, s: res.state, k });
      return out;
    }
    return [{ q: t.type === 'steps' ? 'Решение' : 'Ответ', v: a && a.text ? a.text : '', s: a && a.text ? res.state : 'empty', k: k, steps: t.type === 'steps' }];
  }

  function cmpHtml(t, a, k, res) {
    const rows = rowsOf(t, a, k, res);
    const mark = s => s === 'match' ? '<i class="cm ok" title="совпадает с ключом">✓</i>' : s === 'miss' ? '<i class="cm bad" title="не совпадает">✗</i>' : '';
    return '<table class="cmp"><thead><tr><th>Задание</th><th>Ответ брата</th><th class="kcol">Ключ</th></tr></thead><tbody>'
      + rows.map(r => '<tr class="' + (r.s || '') + '"><td class="q">' + esc(r.q || '') + '</td>'
        + '<td class="a">' + (r.v ? mark(r.s) + (r.steps ? '<pre>' + esc(r.v) + '</pre>' : esc(r.v)) : '<span class="ph">—</span>') + '</td>'
        + '<td class="kcol">' + (r.k != null && r.k !== '' ? esc(firstAlt(r.k)) : '<span class="ph">нет ключа</span>') + '</td></tr>').join('')
      + '</tbody></table>';
  }

  function autoText(t, a, m) {
    const st = status(t, a, m);
    const tries = a && a.tries ? a.tries : 0;
    const map = {
      ok: m && (m.t || 0) >= ((a && a.ct) || 0) ? ['ok', '✓ Ты отметил «Верно»'] : ['ok', '✓ Сам проверил — всё верно' + (tries ? ' (ошибок до этого: ' + tries + ')' : ' с первого раза')],
      help: ['help', 'Разобрали с подсказкой: 3 попытки, правильный ответ показан'],
      pending: ['wait', t.type === 'steps' ? 'Итоговый ответ сходится — посмотри запись решения и поставь «Верно»' : 'Ждёт твоей проверки (ключа нет)'],
      fix: ['fix', '↩ Ты вернул на доработку'],
      work: a && a.lvl ? ['try', 'Проверял: попытка ' + tries + ' из 3, ' + (a.fbk || 0) + ' из ' + (a.fbn || 1) + ' верно'] : ['', a && (a.text || (a.parts && a.parts.some(Boolean))) ? 'Делает, ещё не проверял' : 'Не начинал']
    };
    const [cls, txt] = map[st] || ['', ''];
    return '<span class="auto-pill ' + cls + '">' + esc(txt) + '</span>';
  }

  function paintRows() {
    const l = viewId && lessons[viewId];
    if (!l) return;
    const n = now();
    realTasks(l).forEach(t => {
      const row = $('row-' + t.id);
      if (!row) return;
      const a = answers[t.id], k = keys[t.id], m = marks[t.id];
      const res = check(t, k, a);
      const cmp = cmpHtml(t, a, k, res);
      const box = $('cmp-' + t.id);
      if (box.dataset.h !== cmp) { box.dataset.h = cmp; box.innerHTML = cmp; }
      const au = autoText(t, a, m);
      if ($('auto-' + t.id).innerHTML !== au) $('auto-' + t.id).innerHTML = au;

      const chips = [];
      if (a && a.active >= 1000) chips.push('<span class="chip">активно ' + dur(a.active) + '</span>');
      if (a && a.start) chips.push('<span class="chip">начал в ' + clock(a.start) + '</span>');
      if (a && a.hint) chips.push('<span class="chip warn">открыл подсказку</span>');
      if (m && m.c) chips.push('<span class="chip">твой комментарий: ' + esc(m.c) + '</span>');
      if (m && a && a.t > m.t) chips.push('<span class="chip warn">менял ответ после твоей отметки</span>');
      const ch = chips.join('');
      if ($('chips-' + t.id).innerHTML !== ch) $('chips-' + t.id).innerHTML = ch;

      const un = row.querySelector('[data-unmark]');
      un && un.classList.toggle('hide', !m);
      const typing = presence.online && presence.lesson === viewId && presence.task === t.id && a && n - (a.t || 0) < 5000;
      row.classList.toggle('typing-now', !!typing);
    });
  }

  /* ---------- статус ученика ---------- */
  function paintTop() {
    const st = $('status'), n = now(), p = presence || {};
    let lastT = 0, first = 0, active = 0;
    Object.values(curAnswers).forEach(a => {
      if (a.t > lastT) lastT = a.t;
      if (a.start && (!first || a.start < first)) first = a.start;
      active += a.active || 0;
    });
    const where = p.lesson && lessons[p.lesson] ? (lessons[p.lesson].title || 'блок') : '';
    let cls, txt, sub = '';
    if (!connected) { cls = 'bad'; txt = 'Нет связи'; sub = 'проверь интернет и VPN на этом устройстве'; }
    else if (!p.online) { cls = 'bad'; txt = 'Не на странице'; sub = p.t ? 'вышел в ' + clock(p.t) : 'ещё не заходил'; }
    else if (p.visible === false || p.focus === false) { cls = 'bad'; txt = 'Ушёл в другое окно'; sub = p.t ? 'уже ' + dur(n - p.t) : ''; }
    else if (!where) { cls = 'warn'; txt = 'Выбирает блок'; sub = 'на главном экране'; }
    else if (!lastT) { cls = 'warn'; txt = 'Открыл блок'; sub = where + ' — пока ничего не сделал'; }
    else {
      const idle = n - lastT;
      const num = taskNum(p.lesson, p.task);
      if (idle < 5000) { cls = 'ok'; txt = 'Работает'; sub = where + (num ? ', задание ' + num : ''); }
      else if (idle < 120000) { cls = 'warn'; txt = 'Думает'; sub = where + ', ' + dur(idle) + ' без действий'; }
      else { cls = idle < 300000 ? 'warn' : 'bad'; txt = 'Бездействует'; sub = where + ', ' + dur(idle) + ' без действий'; }
    }
    st.className = 'status ' + cls;
    $('stText').textContent = txt; $('stSub').textContent = sub;

    const end = p.online ? n : lastT;
    $('mTotal').textContent = first ? dur(end - first) : '—';
    $('mActive').textContent = active ? dur(active) : '—';
    const l = curFor && lessons[curFor];
    if (l) {
      const ts = realTasks(l);
      $('mDone').textContent = ts.filter(t => finished(status(t, curAnswers[t.id], curMarks[t.id]))).length + ' из ' + ts.length;
    } else $('mDone').textContent = '—';
  }
  function taskNum(lid, id) {
    const l = lessons[lid];
    if (!l || !id) return 0;
    return realTasks(l).findIndex(t => t.id === id) + 1;
  }

  /* ---------- ручное добавление задания ---------- */
  function addForm() {
    return '<div class="panel" id="addPanel"><h3>Добавить задание</h3><div class="form-grid">'
      + '<div><label for="fType">Тип ответа</label><select id="fType">'
      + '<option value="short">Короткий ответ</option><option value="items">Несколько коротких ответов</option>'
      + '<option value="steps">Ход решения</option><option value="letters">Вставь букву</option></select></div>'
      + '<div><label for="fSubject">Предмет</label><input id="fSubject" placeholder="Математика"></div>'
      + '<div><label for="fTitle">Название</label><input id="fTitle" placeholder="№ 245, стр. 61"></div>'
      + '<div><label for="fHint">Подсказка до проверки</label><input id="fHint" placeholder="необязательно"></div></div>'
      + '<label for="fText">Текст задания</label><textarea id="fText" style="min-height:80px;font-family:inherit;font-size:16px"></textarea>'
      + '<div id="fTplBox" class="hide"><label for="fTpl">Слова с пропусками — каждый пропуск «_»</label><input id="fTpl" placeholder="к_рова, м_локо"></div>'
      + '<div id="fItemsBox" class="hide"><label for="fItems">Пункты — каждый с новой строки: вопрос | ответ</label><textarea id="fItems" placeholder="36 : 4 = | 9\n7 · 8 = | 56" style="font-family:inherit;font-size:16px"></textarea></div>'
      + '<div id="fAnsBox"><label for="fAns" id="fAnsL">Правильный ответ (ученик не видит)</label><input id="fAns"></div>'
      + '<label for="fWhy">Напоминание правила при ошибке — без ответа</label><input id="fWhy" placeholder="например: после глагола — me, him, them">'
      + '<label for="fAlt">Объяснение по-другому — проще, с другого угла</label><input id="fAlt" placeholder="например: подставь по-русски «меня» — если подходит, это me">'
      + '<button class="btn" id="fAdd" style="margin-top:12px">Добавить</button><div class="err" id="fErr"></div></div>';
  }
  function bindAddForm() {
    const type = $('fType');
    const sync = () => {
      const v = type.value;
      $('fTplBox').classList.toggle('hide', v !== 'letters');
      $('fItemsBox').classList.toggle('hide', v !== 'items');
      $('fAnsBox').classList.toggle('hide', v === 'items');
      $('fAnsL').textContent = v === 'letters' ? 'Те же слова целиком, правильно (ученик не видит)'
        : v === 'steps' ? 'Итоговый ответ (ученик не видит)' : 'Правильный ответ (ученик не видит)';
    };
    type.onchange = sync; sync();
    $('fAdd').onclick = () => {
      $('fErr').textContent = '';
      const v = type.value;
      const src = { type: v === 'items' ? 'short' : v, subject: $('fSubject').value.trim(), title: $('fTitle').value.trim(),
        text: $('fText').value.trim(), hint: $('fHint').value.trim(), answer: $('fAns').value.trim(), why: $('fWhy').value.trim(), alt: $('fAlt').value.trim() };
      if (v === 'items') {
        src.items = $('fItems').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
          const i = s.lastIndexOf('|');
          return i < 0 ? { q: s } : { q: s.slice(0, i).trim(), a: s.slice(i + 1).trim() };
        });
        if (!src.items.length) { $('fErr').textContent = 'Добавь хотя бы один пункт.'; return; }
        delete src.answer;
      }
      if (v === 'letters') src.template = $('fTpl').value;
      if (!src.title && !src.text) { $('fErr').textContent = 'Напиши название или текст задания.'; return; }
      let made;
      try {
        const max = sortedTasks(lessons[viewId]).reduce((m, t) => Math.max(m, t.n || 0), 0);
        made = makeTask(src, max + 1);
      } catch (e) { $('fErr').textContent = e.message; return; }
      const tid = 't' + Date.now().toString(36);
      const upd = { ['rooms/' + room + '/lessons/' + viewId + '/tasks/' + tid]: made.task };
      if (hasKey(made.key)) {
        upd['keys/' + room + '/' + viewId + '/' + tid] = made.key;
        upd['rooms/' + room + '/check/' + viewId + '/' + tid] = enc(made.key);
      }
      db.ref().update(upd).then(() => toast('Задание добавлено — у брата оно уже есть')).catch(fail);
    };
  }

  /* ---------- резервная копия ---------- */
  $('backupBtn').onclick = async () => {
    try {
      const [r, k] = await Promise.all([R.once('value'), db.ref('keys/' + room).once('value')]);
      const blob = new Blob([JSON.stringify({ saved: new Date().toISOString(), room, data: r.val(), keys: k.val() }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'repetitor-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { fail(e); }
  };
})();
</script>
</body>
</html>
